<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeerConnect — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  PeerConnect demo — NorCal seed. INTERNAL DEMO ONLY. DO NOT COMMIT TO A PUBLIC REPO.

  The 24 people in Peers are real, published on NorCal SCI's public mentor page
  (norcalsci.org/peer-mentors). They have not signed up here — in this build they are
  shown as ordinary members so the flows demo cleanly. At launch these become real
  members via the org invite link (PRD 11.1), which is also the consent step.
  Photos are hotlinked from NorCal's CDN and some filenames contain surnames.
  Events and organizations are invented. No contact details are in this file.
-->
<style>
:root{
  --canvas:#EFF2EE; --paper:#fff; --ink:#111A16; --ink2:#46524C;
  --pine:#14483C; --pine-hi:#1B5F4E; --tint:#DDE9E3; --clay:#C9491B; --clay-t:#FBE7DE;
  --line:#C9D2CC; --grey:#8A968F;
  --head:Archivo,"Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:#DCE2DB;font-family:var(--body);color:var(--ink);
  display:flex;align-items:center;justify-content:center}
#phone{width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--canvas);
  display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(17,26,22,.25)}
@media(min-width:520px){#phone{border-radius:30px;height:min(900px,calc(100dvh - 40px))}}
#root{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{flex:none;display:flex;gap:9px;align-items:center;padding:14px 18px 8px}
.top h2{font-family:var(--head);font-weight:800;font-size:24px;margin:0;flex:1}
.seg{min-height:44px;padding:0 20px;border-radius:22px;border:2px solid var(--line);background:var(--paper);
  font-family:var(--head);font-weight:700;font-size:15.5px;color:var(--ink)}
.seg[aria-selected="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.icb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--paper);
  display:grid;place-items:center;flex:none;margin-left:auto}
.fbar{flex:none;display:flex;gap:8px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.fchip.on{border-color:var(--pine);background:var(--tint);color:var(--pine)}

/* deck + cards */
.deck{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 12px}
.deck.snap{scroll-snap-type:y mandatory}
.card{position:relative;width:100%;height:calc(100% - 8px);min-height:430px;border-radius:26px;overflow:hidden;
  scroll-snap-align:center;margin-bottom:14px;display:block;text-align:left;border:0;padding:0;color:#fff}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .init{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-weight:800;
  font-size:118px;color:rgba(255,255,255,.28)}
.card .scrim{position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(to top,rgba(8,14,11,.93) 12%,rgba(8,14,11,.55) 44%,transparent)}
.card .scrim-top{position:absolute;left:0;right:0;top:0;height:34%;
  background:linear-gradient(to bottom,rgba(8,14,11,.55),transparent)}
.card .head{position:absolute;top:20px;left:22px;right:22px}
.card .head h3{font-family:var(--head);font-size:29px;margin:0 0 7px;letter-spacing:-.02em}
.card .head .l{font-size:14px;color:#e6ece8;margin-bottom:3px}
.pillw{display:inline-block;background:#fff;color:var(--pine);font-size:11.5px;font-weight:700;
  padding:6px 12px;border-radius:14px;margin-top:8px}
.card .foot{position:absolute;left:22px;right:22px;bottom:20px}
.card .bio{font-size:14px;line-height:1.42;max-width:64%;margin:0 0 13px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chipstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chipstrip::-webkit-scrollbar{display:none}
.chipstrip span{flex:none;background:#fff;color:var(--ink);font-size:12.5px;font-weight:700;
  padding:9px 14px;border-radius:19px}
.wave{position:absolute;right:18px;bottom:70px;width:72px;height:72px;border-radius:50%;border:0;
  background:var(--clay);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.wave.done{background:var(--pine)}
.wave svg{width:36px;height:36px}

/* events */
.ev{width:100%;text-align:left;background:var(--paper);border:1.6px solid var(--line);border-radius:16px;
  padding:14px 15px 13px;margin-bottom:12px;display:flex;gap:13px;position:relative}
.date{width:58px;height:58px;border-radius:13px;background:var(--tint);flex:none;display:flex;
  flex-direction:column;align-items:center;justify-content:center;color:var(--pine)}
.date b{font-family:var(--head);font-size:20px;line-height:1}
.date i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.evb{flex:1;min-width:0}
.tt{font-family:var(--head);font-weight:700;font-size:16px;line-height:1.2;padding-right:22px}
.badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:9px;white-space:nowrap}
.badge.v{background:var(--clay);color:#fff}
.badge.r{background:var(--tint);color:var(--pine)}
.meta{font-size:13px;color:var(--ink2);line-height:1.42;margin-top:3px}
.counts{font-size:12.5px;font-weight:700;color:var(--pine);margin-top:7px}
.counts em{font-style:normal;color:var(--ink2);font-weight:600}
.match{font-size:12.5px;font-weight:700;color:var(--clay);margin-top:2px}
.acts{display:flex;gap:8px;margin-top:10px}
.mini{min-height:36px;padding:0 15px;border-radius:12px;font-family:var(--head);font-size:13.5px;font-weight:700;
  border:2px solid var(--pine);background:transparent;color:var(--pine);display:inline-flex;align-items:center;gap:5px}
.mini.solid{background:var(--pine);color:#fff}
.mini.done{background:var(--tint);border-color:var(--tint);color:var(--pine)}
.x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:0;background:none;
  display:grid;place-items:center;color:var(--grey)}

/* generic page */
.page{position:absolute;inset:0;background:var(--canvas);display:flex;flex-direction:column;z-index:10}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 20px 18px}
.back{background:none;border:0;color:var(--pine);font-weight:700;font-size:15px;padding:14px 0 4px}
h1{font-family:var(--head);font-size:26px;margin:6px 0 6px;letter-spacing:-.02em;line-height:1.18}
h1.sm{font-size:23px}
p.sub{font-size:14.5px;line-height:1.45;color:var(--ink2);margin:0 0 14px}
p.txt{font-size:14.5px;line-height:1.5;margin:10px 0 0}
h3.sec{font-family:var(--head);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink2);margin:18px 0 8px}
.hint{font-size:12.5px;color:var(--ink2);margin:-2px 0 9px;line-height:1.4}
.when{font-weight:700;color:var(--pine);font-size:14.5px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:36px;padding:0 13px;border-radius:18px;border:2px solid var(--line);background:var(--paper);
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;color:var(--ink);gap:5px}
.chip.on{border-color:var(--pine);background:var(--tint);color:var(--pine)}
.chip.dash{border-style:dashed}
.note{background:var(--tint);border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.45;margin:14px 0 0}
.note.warn{background:var(--clay-t);color:#5C2410}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row .nm{font-family:var(--head);font-size:15px;font-weight:700;display:block}
.row .s{font-size:12.5px;color:var(--ink2);margin-top:2px;display:block}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:11px;background:var(--tint);color:var(--pine);white-space:nowrap}
.pill.todo{background:#E7EAE6;color:var(--ink2)}
.pill.new{background:var(--clay);color:#fff}
.sw{width:48px;height:28px;border-radius:16px;background:var(--line);position:relative;flex:none;border:0;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .16s}
.sw.on{background:var(--pine)}
.sw.on i{left:23px}
.fld{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--line);background:#fff;
  padding:13px 15px;font:inherit;font-size:15px;color:var(--ink);font-family:var(--body)}
.area{min-height:110px;line-height:1.45;resize:none}
.count{font-size:12px;color:var(--ink2);font-weight:600;margin-top:7px;text-align:right}

/* org row + faces */
.orgrow{display:flex;align-items:center;gap:11px;background:var(--paper);border:1.6px solid var(--line);
  border-radius:15px;padding:11px 12px;margin-top:13px;width:100%;text-align:left}
.logo{width:42px;height:42px;border-radius:12px;background:var(--pine);color:#fff;flex:none;
  display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:15px}
.orgrow .nm{font-family:var(--head);font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px}
.orgrow .s{font-size:12.5px;color:var(--ink2);margin-top:1px;display:block}
.tick{width:15px;height:15px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:9px}
.follow{min-height:36px;padding:0 14px;border-radius:12px;border:2px solid var(--pine);background:transparent;
  color:var(--pine);font-family:var(--head);font-size:13.5px;font-weight:700;margin-left:auto;flex:none}
.follow.on{background:var(--tint);border-color:var(--tint)}
.faces{display:flex;margin:9px 0 0}
.face{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--canvas);margin-left:-11px;
  display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800;font-size:15px}
.face:first-child{margin-left:0}
.face.more{background:var(--tint);color:var(--pine)}
.youknow{background:var(--tint);border-radius:13px;padding:11px 13px;font-size:13.5px;line-height:1.45;margin-top:11px}
.youknow b{color:var(--pine)}
.privnote{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.45}
.accline{font-size:13.5px;color:var(--ink2);font-weight:600;margin-top:13px}
.accwarn{font-size:13.5px;color:var(--clay);font-weight:700;margin-top:4px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 2px}
.hero .logo{width:74px;height:74px;border-radius:22px;font-size:24px}
.hero h1{margin:12px 0 2px;font-size:25px}
.wide{width:100%;min-height:50px;border-radius:14px;border:0;background:var(--pine);color:#fff;
  font-family:var(--head);font-size:16px;font-weight:700;margin-top:14px}
.wide.on{background:var(--tint);color:var(--pine)}
.evrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.evrow .t{font-family:var(--head);font-weight:700;font-size:14.5px;display:block}
.evrow .s{font-size:12.5px;color:var(--ink2);margin-top:1px;display:block}
.evrow .date{width:48px;height:48px}
.evrow .date b{font-size:17px}

/* tips, photos, video */
.tip{background:var(--paper);border:1.6px solid var(--line);border-radius:16px;padding:14px;margin-top:11px}
.tip .tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:11px;
  background:var(--tint);color:var(--pine);margin-bottom:8px}
.tip p{margin:0;font-size:14px;line-height:1.45}
.vid{display:flex;gap:11px;align-items:center;background:var(--paper);border:1.6px solid var(--line);
  border-radius:14px;padding:9px;margin-top:10px}
.vid .thumb{width:92px;height:58px;border-radius:10px;flex:none;display:grid;place-items:center;background:#274B66}
.vid .play{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;
  color:var(--pine);font-size:11px}
.vid .t{font-family:var(--head);font-size:13.5px;font-weight:700;line-height:1.25;display:block}
.vid .s{font-size:11.5px;color:var(--ink2);margin-top:3px;display:block}
.addlink{width:100%;min-height:46px;border-radius:12px;border:2px dashed var(--pine);background:transparent;
  color:var(--pine);font-family:var(--head);font-size:13.5px;font-weight:700;margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.pgrid .lead{grid-column:span 2;grid-row:span 2;border-radius:16px;position:relative;overflow:hidden;
  display:grid;place-items:end start;color:#fff;padding:11px;font-size:12px;font-weight:700;min-height:170px}
.pgrid .cell{border-radius:14px;min-height:80px;display:grid;place-items:end start;color:#fff;padding:9px;
  font-size:11px;font-weight:700;position:relative}
.pgrid .add{border-radius:14px;min-height:80px;border:2.5px dashed var(--pine);display:grid;place-items:center;
  color:var(--pine);background:none}
.lead .tagp{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);color:var(--pine);
  font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:10px}
.mini-card{position:relative;height:180px;border-radius:18px;overflow:hidden;background:#274B66;margin-top:10px}
.mini-card .scrim{position:absolute;left:0;right:0;bottom:0;height:74%;
  background:linear-gradient(to top,rgba(8,14,11,.94) 14%,rgba(8,14,11,.5) 48%,transparent)}
.mini-card .who{position:absolute;top:14px;left:16px;color:#fff}
.mini-card .who b{font-family:var(--head);font-size:19px;display:block}
.mini-card .who span{font-size:11.5px;color:#e2e9e5}
.mini-card .bio{position:absolute;left:16px;right:16px;bottom:14px;color:#fff;font-size:12.5px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ring{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-family:var(--head);font-weight:800;font-size:15px;color:var(--pine)}
.ring i{width:50px;height:50px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-style:normal}
.cardbox{background:var(--paper);border:1.6px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.avatar{width:74px;height:74px;border-radius:24px;background:var(--pine);color:#fff;display:grid;place-items:center;
  font-family:var(--head);font-weight:800;font-size:25px}

/* progress */
.prog{flex:none;padding:12px 20px 0}
.prog .r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog .nm{font-family:var(--head);font-size:13px;font-weight:700;color:var(--pine)}
.prog .ct{font-size:12.5px;font-weight:600;color:var(--ink2)}
.track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--pine);border-radius:3px;transition:width .3s}

/* footer + nav + sheet + toast */
footer.cta{flex:none;padding:10px 20px max(14px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--canvas) 74%,rgba(239,242,238,0));display:flex;gap:9px}
.btn{flex:1;min-height:54px;border-radius:14px;border:2px solid var(--pine);background:transparent;color:var(--pine);
  font-family:var(--head);font-size:16.5px;font-weight:700}
.btn.solid{background:var(--pine);color:#fff}
.btn.link{background:none;border:0;color:var(--ink2);min-height:44px;font-family:var(--body);font-size:14.5px}
nav{flex:none;margin:0 16px max(12px,env(safe-area-inset-bottom));background:var(--paper);
  border:1.6px solid var(--line);border-radius:24px;display:flex;padding:9px 0}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10.5px;font-weight:700;color:var(--grey);padding:2px 0}
nav button[aria-current="page"]{color:var(--pine)}
nav .ic{width:22px;height:22px;position:relative}
nav .av{width:22px;height:22px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;
  font-size:10px;font-weight:800;font-family:var(--head)}
.badge-n{position:absolute;transform:translate(12px,-6px);background:var(--clay);color:#fff;
  border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
.veil{position:absolute;inset:0;background:rgba(8,14,11,.42);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--canvas);border-radius:24px 24px 0 0;z-index:21;
  max-height:88%;display:flex;flex-direction:column;padding-bottom:6px}
.sheet .shead{flex:none;display:flex;align-items:center;gap:12px;padding:16px 20px 10px}
.sheet .shead h2{font-family:var(--head);font-size:22px;margin:0;flex:1}
.txtbtn{background:none;border:0;font-size:14px;font-weight:700;color:var(--pine)}
.xbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--paper);
  display:grid;place-items:center;flex:none}
.genre{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.genre b{font-family:var(--head);font-size:15px}
.genre .cnt{font-size:12px;color:var(--ink2);font-weight:600;margin-left:7px}
.state{font-size:12px;font-weight:700;padding:5px 11px;border-radius:12px;background:var(--tint);color:var(--pine);border:0}
.state.n{background:#E7EAE6;color:var(--ink2)}
.state.m{background:var(--clay-t);color:#8A3413}
.restore{min-height:32px;padding:0 13px;border-radius:11px;border:2px solid var(--pine);background:transparent;
  color:var(--pine);font-family:var(--head);font-size:12.5px;font-weight:700}
.toast{position:absolute;left:18px;right:18px;bottom:98px;background:var(--pine);color:#fff;border-radius:14px;
  padding:13px 16px;font-size:13.5px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.28);
  display:flex;align-items:center;gap:12px}
.toast button{background:none;border:0;color:#fff;font-weight:800;text-decoration:underline;margin-left:auto;font-size:13.5px}
.empty{text-align:center;padding:52px 20px;color:var(--ink2)}
.empty b{display:block;font-family:var(--head);font-size:19px;color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div id="phone"><div id="root"></div></div>
<script>

/* --------------------------------------------------- placeholder imagery
   Procedural SVG scenes, inlined as data URIs — no network, no stock photos
   of people who never agreed to be here. Swap PHOTOS for real image URLs and
   everything below keeps working; the initials tile stays as the fallback. */
function scene(kind, a, b, c){
  /* Horizon sits mid-frame so any crop — tall card, short hero, tiny row
     tile — still reads as a picture rather than a slab of colour. */
  const sun = `<circle cx="300" cy="150" r="46" fill="#ffffff40"/>`;
  const bits = {
    trail: `${sun}
      <path d="M0 250 Q110 190 220 245 T400 235 V520 H0Z" fill="${c}" opacity=".55"/>
      <path d="M0 300 Q140 255 260 300 T400 292 V520 H0Z" fill="${c}"/>
      <path d="M140 520 Q190 400 205 305 Q222 400 270 520Z" fill="#ffffff33"/>`,
    water: `${sun}
      <path d="M0 280 H400 V520 H0Z" fill="${c}"/>
      <g stroke="#ffffff33" stroke-width="7" fill="none">
        <path d="M0 330 Q100 314 200 330 T400 330"/><path d="M0 385 Q100 369 200 385 T400 385"/>

function completeness(){
  const m = S.me, bits = [
    !!m.bio, m.photos.length >= 3, true /* interests from signup */,
    m.mentor !== null, m.injuryDone, m.lifeDone,
    m.topics.length > 0, m.tips.length > 0, !!m.equipment, !!m.wish
  ];
  return Math.round(bits.filter(Boolean).length / bits.length * 100);
}

/* ------------------------------------------------------------ event maths */
function eventVisible(e){
  if (S.eventTag){                       // an explicit tap beats every other filter
    const t = S.eventTag;
    if (t.kind === "genre") return e.genre === t.val;
    if (t.kind === "activity") return e.activity === t.val;
    if (t.val === "Online") return e.mode === "virtual";
    if (t.val === "In person") return e.mode !== "virtual";
    if (t.val === "Beginner-friendly") return !!e.beginner;
  }
  if (S.mutes.events.includes(e.id)) return false;
  if (S.mutes.orgs.includes(e.org)) return false;
  if (S.mutes.activities.includes(e.activity)) return false;
  if (S.mutes.genres.includes(e.genre)) return false;
  const online = e.mode === "virtual";
  if (online && !S.includeOnline) return false;
  if (!online && e.state !== S.place) return false;
  if (online && !S.formats["Online"]) return false;
  if (!online && !S.formats["In person"]) return false;
  if (e.recurring && !S.formats["Recurring"]) return false;
  if (S.formats["Beginner-friendly"] && !e.beginner) return false;
  if (S.feed === "foryou" && !S.activities[e.activity]) return false;
  if (S.when === "week" && Number(e.num) > 27) return false;
  return true;
}

        <div class="l">${p.band ? esc(p.band) + " · " : ""}${esc(p.city)}</div>
        ${p.isMentor ? `<span class="pillw">${esc(org(p.org).name)} mentor</span>` : ""}

      </div>
      <div class="foot">
        <p class="bio">${esc(p.bio)}</p>

        aria-label="Say hi to ${esc(p.name)}">${HAND}</span>
    </button>`;
  }).join("");
  const active = [];
  if (S.peerFilter.topic) active.push(["topic", "Talks about " + S.peerFilter.topic.toLowerCase()]);

      `<button class="fchip on" data-clearpeer="${k}">${esc(l)} ✕</button>`).join("")}</div>` : "";

/* --------------------------------------------------------------- events */
function eventCard(e){
  const o = org(e.org), st = S.rsvps[e.id], conns = connectionsGoing(e);
  const badges = [];
  if (e.mode === "virtual") badges.push(`<span class="badge v">Online</span>`);
  if (e.recurring) badges.push(`<span class="badge r">Recurring</span>`);
  const counts = e.standing
    ? `Standing group <em>·</em> ${e.going} regulars`
    : `${e.going + (st === "going" ? 1 : 0)} going <em>·</em> ${e.interested + (st === "interested" ? 1 : 0)} interested`;
  const line = conns.length
    ? `<div class="match" style="color:var(--pine)">${esc(conns[0].name)}${conns.length > 1 ? ` and ${conns.length - 1} other connection${conns.length > 2 ? "s" : ""} are` : " is"} going</div>`
    : (e.matchLine ? `<div class="match">${esc(e.matchLine)}</div>` : "");
  return `<div class="ev">
    <button class="x" data-notint="${e.id}" aria-label="Not interested">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
    <button class="date" data-ev="${e.id}" style="border:0"><i>${e.day}</i><b>${e.num}</b></button>
    <div class="evb">
      <button style="background:none;border:0;padding:0;text-align:left;width:100%" data-ev="${e.id}">
        <div class="tt">${esc(e.title)}</div>
        ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}
        <div class="meta">${esc(o.name)} · ${esc(e.city)}<br>${esc(e.short)}</div>
        <div class="counts">${counts}</div>
        ${line}
      </button>
      <div class="acts">
        <button class="mini ${st === "interested" ? "done" : ""}" data-rsvp="${e.id}|interested">Interested${st === "interested" ? " ✓" : ""}</button>

}

function events(){

/* ------------------------------------------------- profile flow, step list */
const FLOW = ["bio","photos","mentor","injury","life","topics","tips","equipment","wish"];
const FLOW_TITLE = {
  bio:"In your own words", photos:"Your photos", mentor:"Being a mentor", injury:"Your injury",
  life:"Life now", topics:"Ask me about", tips:"Tips and tricks", equipment:"Your equipment",
  wish:"What you wish you'd known"
};

function flowList(){
  const m = S.me, done = x => x ? `<span class="pill">Done</span>` : `<span class="pill todo">To do</span>`;
  return `<div class="page">
    <div class="prog"><div class="r"><span class="nm">PeerConnect</span><span class="ct">${completeness()}% complete</span></div>
      <div class="track"><i style="width:${completeness()}%"></i></div></div>
    <div class="scroll">
      <button class="back" data-act="closeflow">← Me</button>
      <h1 class="sm">Your profile</h1>
      <p class="sub">Do as much or as little as you like. Everything here is optional and editable.</p>

      <h3 class="sec">About you — helps matching</h3>
      <button class="row" data-flow="bio"><span><span class="nm">In your own words</span><span class="s">The three lines on your card</span></span>${done(!!m.bio)}</button>
      <button class="row" data-flow="photos"><span><span class="nm">Your photos</span><span class="s">Doing things you enjoy</span></span><span class="pill">${m.photos.length} added</span></button>
      <button class="row" data-act="noop"><span><span class="nm">Interests &amp; activities</span><span class="s">Pick your top three</span></span><span class="pill">Done</span></button>

      <h3 class="sec">Willing to help — makes you findable</h3>
      <button class="row" data-flow="mentor"><span><span class="nm">Do you want to be a mentor?</span><span class="s">One question, asked once</span></span>${m.mentor === null ? `<span class="pill new">Ask</span>` : `<span class="pill">${m.mentor ? "Yes" : "Not now"}</span>`}</button>
      <button class="row" data-flow="injury"><span><span class="nm">Your injury</span><span class="s">Type, level, how it happened</span></span>${done(m.injuryDone)}</button>
      <button class="row" data-flow="life"><span><span class="nm">Life now</span><span class="s">Independence, work, family</span></span>${done(m.lifeDone)}</button>
      <button class="row" data-flow="topics"><span><span class="nm">Ask me about</span><span class="s">Topics and self-care</span></span>${done(m.topics.length > 0)}</button>

      <h3 class="sec">Your story — the part people read</h3>
      <button class="row" data-flow="tips"><span><span class="nm">Tips and tricks</span><span class="s">Photos and video welcome</span></span><span class="pill">${m.tips.length}</span></button>
      <button class="row" data-flow="equipment"><span><span class="nm">Your favourite equipment</span><span class="s">Make, model, and an offer</span></span>${done(!!m.equipment)}</button>
      <button class="row" data-flow="wish"><span><span class="nm">What you wish you'd known</span><span class="s">Written to someone three months in</span></span>${done(!!m.wish)}</button>
      <div style="height:14px"></div>
    </div>
    <footer class="cta"><button class="btn solid" data-flow="${nextUndone()}">Continue</button></footer></div>`;
}

function nextUndone(){
  const m = S.me;
  if (!m.bio) return "bio";
  if (m.mentor === null) return "mentor";
  if (!m.injuryDone) return "injury";
  if (!m.lifeDone) return "life";
  if (!m.equipment) return "equipment";
  if (!m.wish) return "wish";
  return "list";
}

function flowShell(step, body, footer){
  const i = FLOW.indexOf(step) + 1;
  return `<div class="page">
    <div class="prog"><div class="r"><span class="nm">${FLOW_TITLE[step]}</span><span class="ct">${i} of ${FLOW.length}</span></div>
      <div class="track"><i style="width:${Math.round(i / FLOW.length * 100)}%"></i></div></div>
    <div class="scroll">
      <button class="back" data-flow="list">← Your profile</button>
      ${body}
      <div style="height:12px"></div>
    </div>
    <footer class="cta">${footer}</footer></div>`;
}

function flowScreen(){
  const m = S.me;
  switch (S.flow){
    case "list": return flowList();

    case "bio": {
      const text = m.bioDraft !== undefined ? m.bioDraft : m.bio;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      return flowShell("bio", `
        <h1 class="sm">In your own words</h1>
        <p class="sub">The lines under your photo. People read this before anything else on your profile — and often instead of everything else.</p>
        <textarea class="fld area" id="bio" data-bind="bioDraft" placeholder="A few sentences on who you are.">${esc(text)}</textarea>
        <div class="count">${words} word${words === 1 ? "" : "s"} ${words && words < 60 ? "· fits your card" : words >= 60 ? "· the card will cut this short" : ""}</div>
        <h3 class="sec">Stuck? Start with one of these</h3>
        <div class="chips">

        </div>
        <h3 class="sec">On your card</h3>
        <div class="mini-card" style="background:#274B66">
          <div class="scrim"></div>
          <div class="who"><b>Alex R.</b><span>SCI - para · T6 · Manual chair</span></div>
          <div class="bio">${esc(text) || `<span style="opacity:.6">Your bio appears here.</span>`}</div>
        </div>
        <div class="note">We never rewrite this. It is the one part of the profile that has to sound like you.</div>`,
        `<button class="btn" data-flow="list">Skip</button><button class="btn solid" data-save="bio">Save</button>`);
    }

    case "photos": return flowShell("photos", `
      <h1 class="sm">Add a few photos</h1>
      <p class="sub">Not portraits — photos of you <b>doing something</b>. Travelling, handcycling, in the garden, cooking, with the dog. That is what someone four months in is looking for.</p>
      <div class="pgrid">
        ${m.photos.map((p, i) => i === 0
          ? `<span class="lead" style="background:${p.color}"><span class="tagp">Your card photo</span>${esc(p.label)}</span>`

        ${Array.from({length: Math.max(0, 6 - m.photos.length)}).slice(0,2).map(() => `<button class="add" data-act="addphoto">${PLUS}</button>`).join("")}
      </div>
      <p class="hint" style="margin-top:11px">Drag to reorder. The first one is the photo on your card.</p>
      <h3 class="sec">Tag what you are doing</h3>
      <p class="hint">Tagging a photo adds that interest to your profile, so it feeds your matches too.</p>
      <div class="chips">${m.photos.map(p => `<span class="chip on">${esc(p.tag)}</span>`).join("")}<button class="chip" data-act="addphoto">Add</button></div>
      <div class="note">Each photo takes alt text, and photos follow your photo visibility setting — members only, or public.</div>`,
      `<button class="btn" data-flow="list">Skip</button><button class="btn solid" data-flow="mentor">Continue</button>`);

    case "mentor": return flowShell("mentor", `
      <h1>Do you want to be a mentor?</h1>
      <p class="sub">An explicit question, asked once. Nothing you fill in turns this on by itself.</p>
      <h3 class="sec">If you say yes</h3>

      <div class="row"><span><span class="nm">People can message you first</span><span class="s">No wave back needed</span></span></div>
      <div class="row"><span><span class="nm">You set your capacity</span><span class="s">Open · at capacity · paused</span></span></div>
      ${m.mentor === true ? `<div class="note"><b>You are listed as an experienced peer.</b> If an organization vouches for you, their badge appears too.</div>` : ""}
      ${m.mentor === false ? `<div class="note">Saved as <b>not now</b>. Everything else on your profile still works — you just will not be messaged first by a stranger.</div>` : ""}
      <div class="note">Craig and NorCal train their mentors. Without an organization behind you, you are listed as an <b>experienced peer</b>.</div>`,

      <div class="chips">${["SCI - para","SCI - quad","TBI","Spina Bifida","MS","Other"].map((x,i) => `<span class="chip ${i===0?"on":""}">${x}</span>`).join("")}</div>

      <h3 class="sec">Complete or incomplete</h3>

    case "topics": return flowShell("topics", `

    case "tips": return flowShell("tips", `

      <p class="sub">The small things that make your life easier. These are what people actually copy — add one, or ten.</p>
      ${m.tips.map(t => `<div class="tip">
        <span class="tag">${esc(t.topic)}</span>

    case "equipment": {

      return flowShell("equipment", `

        <button class="addlink" data-act="addphoto">+ Add a photo or video</button>
        <button class="row" data-act="noop" style="margin-top:14px"><span><span class="nm">Happy to advise, or let someone try it</span>
          <span class="s">Adds an Ask me about chip</span></span><span class="sw on"><i></i></span></button>`,
        `<button class="btn" data-flow="list">Back</button><button class="btn solid" data-save="equipment">Save</button>`);

    case "wish": {
      const text = m.wishDraft !== undefined ? m.wishDraft : m.wish;
      return flowShell("wish", `
        <h1 class="sm">What do you wish you'd known when you were freshly injured?</h1>

        <div class="note">Shown to people in their first year before it is shown to anyone else — it is the line that gets a first message sent.</div>
        <h3 class="sec">Where this appears</h3>
        <button class="row" data-act="noop"><span><span class="nm">On your profile</span></span><span class="sw on"><i></i></span></button>
        <button class="row" data-act="noop"><span><span class="nm">In Mentors browse, as a card line</span></span><span class="sw on"><i></i></span></button>`,
        `<button class="btn" data-flow="list">Back</button><button class="btn solid" data-save="wish">Finish</button>`);

}

/* --------------------------------------------------------------- sheets */
function filterSheet(){
  const n = visibleEvents().length;
  const hidden = [
    ...S.mutes.orgs.map(id => ({k:"org", id, nm:org(id).name, s:"Organization"})),
    ...S.mutes.activities.map(a => ({k:"activity", id:a, nm:a, s:"Activity"})),
    ...S.mutes.events.map(e => ({k:"event", id:e, nm:DATA.events.find(x => x.id === e).title, s:"Single event"}))
  ];
  return `<div class="veil" data-act="closesheet"></div>
    <div class="sheet">
      <div class="shead"><h2>Filters</h2>
        <button class="txtbtn" data-act="reset">Reset</button>
        <button class="xbtn" data-act="closesheet" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111A16" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
      <div class="scroll">
        <h3 class="sec" style="margin-top:0">Feed</h3>
        <div style="display:flex;gap:8px">
          <button class="btn ${S.feed === "foryou" ? "solid" : ""}" style="min-height:46px;font-size:15px" data-feed="foryou">For you</button>
          <button class="btn ${S.feed === "all" ? "solid" : ""}" style="min-height:46px;font-size:15px" data-feed="all">Everything</button>
        </div>
        <p class="hint" style="margin-top:9px">For you is built from what you picked at signup and what you have marked since. Everything is the full list.</p>

        <h3 class="sec">Where</h3>
        <div class="chips">
          <button class="chip ${S.place === "California" ? "on" : ""}" data-place="California">California</button>
          <button class="chip ${S.place === "Arizona" ? "on" : ""}" data-place="Arizona">Arizona</button>
        </div>
        <button class="row" data-toggle="includeOnline" style="margin-top:6px">
          <span><span class="nm">Include online events</span><span class="s">They ignore the state filter</span></span>
          <span class="sw ${S.includeOnline ? "on" : ""}"><i></i></span></button>

        <h3 class="sec">When</h3>
        <div class="chips">
          ${[["week","This week"],["month","This month"],["any","Anything"]].map(([k,l]) =>
            `<button class="chip ${S.when === k ? "on" : ""}" data-when="${k}">${l}</button>`).join("")}
        </div>

        <h3 class="sec">Format</h3>
        <div class="chips">${Object.keys(S.formats).map(f =>
          `<button class="chip ${S.formats[f] ? "on" : ""}" data-format="${esc(f)}">${esc(f)}</button>`).join("")}</div>

        <h3 class="sec">Activities</h3>
        ${DATA.genres.map(g => {
          const acts = DATA.activitiesByGenre[g];
          const on = acts.filter(a => S.activities[a] && !S.mutes.activities.includes(a)).length;
          const genreOn = !S.mutes.genres.includes(g);
          return `<div class="genre"><span><b>${esc(g)}</b><span class="cnt">${genreOn ? `${on} of ${acts.length}` : "Off"}</span></span>
              <button class="sw ${genreOn ? "on" : ""}" data-genre="${esc(g)}"><i></i></button></div>
            ${genreOn ? `<div class="chips">${acts.map(a =>
              `<button class="chip ${S.activities[a] && !S.mutes.activities.includes(a) ? "on" : ""}" data-activity="${esc(a)}">${esc(a)}</button>`).join("")}</div>` : ""}`;
        }).join("")}

        <h3 class="sec">Organizations</h3>
        <p class="hint">Following puts an org's events at the top.</p>
        ${DATA.orgs.map(o => {
          const st = S.mutes.orgs.includes(o.id) ? "m" : (S.follows[o.id] ? "" : "n");
          const label = st === "m" ? "Muted" : st === "" ? "Following" : "Neutral";
          return `<button class="row" data-orgstate="${o.id}"><span><span class="nm">${esc(o.name)}</span></span>
            <span class="state ${st}">${label}</span></button>`;
        }).join("")}

        <h3 class="sec">Hidden — ${hidden.length}</h3>
        ${hidden.length ? hidden.map(h => `<div class="row">
            <span><span class="nm">${esc(h.nm)}</span><span class="s">${h.s}</span></span>
            <button class="restore" data-restore="${h.k}|${esc(h.id)}">Restore</button></div>`).join("")
          : `<p class="hint">Nothing hidden.</p>`}
        <div style="height:10px"></div>
      </div>
      <footer class="cta"><button class="btn solid" data-act="closesheet">Show ${n} event${n === 1 ? "" : "s"}</button></footer>
    </div>`;
}

  return `<div class="veil" data-act="closesheet"></div>
    <div class="sheet">
      <div class="shead"><h2>Stop showing</h2>
        <button class="xbtn" data-act="closesheet" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111A16" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
      <div class="scroll">
        <p class="sub">We ask what to stop showing, not why. Everything here is reversible from Filters.</p>
        <button class="row" data-mute="org|${o.id}"><span><span class="nm">Stop showing ${esc(o.name)} events</span>
          <span class="s">Mutes the organization</span></span><span class="pill todo">Org</span></button>
        <button class="row" data-mute="activity|${esc(e.activity)}"><span><span class="nm">Stop showing ${esc(e.activity.toLowerCase())}</span>
          <span class="s">Mutes the activity and down-weights it</span></span><span class="pill todo">Activity</span></button>
        <button class="row" data-mute="genre|${esc(e.genre)}"><span><span class="nm">Stop showing ${esc(e.genre.toLowerCase())}</span>
          <span class="s">The big lever</span></span><span class="pill todo">Category</span></button>
        <button class="row" data-mute="event|${e.id}"><span><span class="nm">Hide this event</span>
          <span class="s">Touches nothing else</span></span><span class="pill todo">Once</span></button>

/* ------------------------------------------------------------------ nav */
const NAV = [["discover","Discover"],["events","Events"],["chats","Chats"],["activity","Activity"],["me","Me"]];
function nav(){
  return `<nav>${NAV.map(([k,l]) => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>
    <span class="ic">${k === "me" ? `<span class="av">A</span>` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">${
      k === "discover" ? `<circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/><circle cx="12" cy="12" r="2" fill="currentColor"/>`
      : k === "events" ? `<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>`
      : k === "chats" ? `<path d="M20.5 12a8 8 0 1 1-3.2-6.4"/><path d="M4 20l1.6-4"/><circle cx="12" cy="12" r="1" fill="currentColor"/>`
      : `<path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/>`}
    </svg>`}${k === "chats" && S.connections.length ? `<span class="badge-n">${S.connections.length}</span>` : ""}</span>${l}</button>`).join("")}</nav>`;
}

/* --------------------------------------------------------------- render */
function render(){
  if (S.setup){ $("#root").innerHTML = setupView(); return; }
  const body = S.tab === "discover" ? discover()
             : S.tab === "events" ? events()
             : S.tab === "chats" ? chats()
             : S.tab === "activity" ? activity() : meTab();
  $("#root").innerHTML = `<div class="screen">${body}${nav()}</div>
    ${S.flow ? flowScreen() : ""}
    ${S.view === "person" ? personPage() : S.view === "event" ? eventPage() : S.view === "org" ? orgPage() : ""}
    ${S.sheet === "filters" ? filterSheet() : S.sheet === "notint" ? notIntSheet() : ""}
    ${S.toast ? `<div class="toast"><span>${esc(S.toast)}</span>${S.undo ? `<button data-act="undo">Undo</button>` : ""}</div>` : ""}`;
}
/* --------------------------------------------------------------- events */
function addConnection(id, why){
  if (!S.connections.includes(id)) S.connections.push(id);
  toast(why, () => { S.connections = S.connections.filter(x => x !== id); delete S.waves[id]; });
}

function applyMute(kind, val){
  const before = JSON.parse(JSON.stringify(S.mutes));
  if (kind === "org") S.mutes.orgs.push(val);
  if (kind === "activity") S.mutes.activities.push(val);
  if (kind === "genre") S.mutes.genres.push(val);
  if (kind === "event") S.mutes.events.push(val);
  const label = kind === "org" ? org(val).name
    : kind === "event" ? DATA.events.find(e => e.id === val).title : val;
  S.sheet = null;
  toast(`Hidden: ${label}. Find it under Filters → Hidden.`, () => { S.mutes = before; });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab],[data-seg],[data-evseg],[data-open],[data-wave],[data-ev],[data-org]," +
    "[data-rsvp],[data-follow],[data-flow],[data-save],[data-starter],[data-topic],[data-device],[data-feed]," +
    "[data-place],[data-when],[data-format],[data-activity],[data-genre],[data-orgstate],[data-restore],[data-mute],[data-toggle],[data-notint]," +
    "[data-ftopic],[data-fint],[data-ftag],[data-clearpeer],[data-cleartag]");
  if (!t) return;
  const d = t.dataset;
  const stash = () => { document.querySelectorAll("[data-bind]").forEach(f => { S.me[f.dataset.bind] = f.value; }); };

  if (d.wave){
    e.stopPropagation(); e.preventDefault();
    const p = person(d.wave);
    if (S.connections.includes(p.id)){ toast(`Opening your thread with ${p.name.split(" ")[0]} — messaging is stubbed in this demo.`); return; }
    S.waves[p.id] = true;
    addConnection(p.id, `You said hi to ${p.name.split(" ")[0]}. They are now in your connections.`);
    return;
  }
  if (d.rsvp){
    const [id, want] = d.rsvp.split("|");
    S.rsvps[id] = S.rsvps[id] === want ? undefined : want;
    if (!S.rsvps[id]) delete S.rsvps[id];
    const ev = DATA.events.find(x => x.id === id);
    render();
    if (S.rsvps[id] === "going" && ev.mode === "virtual") toast("You're going — the join link is on the event page.");
    else if (S.rsvps[id] === "going") toast("You're going. Add to calendar is on the event page.");
    else if (S.rsvps[id] === "interested") toast("Saved. We'll remind you, and nobody sees that you're interested.");
    return;
  }
  if (d.notint){ S.sheet = "notint"; S.sheetEvent = d.notint; render(); return; }
  if (d.mute){ const [k, v] = d.mute.split("|"); applyMute(k, v); return; }
  if (d.restore){
    const [k, v] = d.restore.split("|");
    if (k === "org") S.mutes.orgs = S.mutes.orgs.filter(x => x !== v);
    if (k === "activity") S.mutes.activities = S.mutes.activities.filter(x => x !== v);
    if (k === "genre") S.mutes.genres = S.mutes.genres.filter(x => x !== v);
    if (k === "event") S.mutes.events = S.mutes.events.filter(x => x !== v);
    render(); return;
  }
  if (d.follow){
    e.stopPropagation();
    S.follows[d.follow] = !S.follows[d.follow];
    render();
    toast(S.follows[d.follow] ? `Following ${org(d.follow).name}. Their events move to the top of your feed.` : `Unfollowed ${org(d.follow).name}.`);
    return;
  }
  if (d.ftopic){
    S.peerFilter = { topic: d.ftopic, interest: null };
    S.view = null; S.sel = null; S.tab = "discover"; S.seg = "peers"; render();
    toast(`Showing everyone who talks about ${d.ftopic.toLowerCase()}.`); return;
  }
  if (d.fint){
    S.peerFilter = { topic: null, interest: d.fint };
    S.view = null; S.sel = null; S.tab = "discover"; S.seg = "peers"; render();
    toast(`Showing everyone into ${d.fint.toLowerCase()}.`); return;
  }
  if (d.clearpeer){
    if (d.clearpeer === "all") S.peerFilter = { topic: null, interest: null };
    else S.peerFilter[d.clearpeer] = null;
    render(); return;
  }
  if (d.ftag){
    const [kind, val] = d.ftag.split("|");
    S.eventTag = { kind, val };
    S.view = null; S.sel = null; S.tab = "events"; S.evSeg = "all"; render();
    const n = visibleEvents().length;
    toast(`${n} event${n === 1 ? "" : "s"} tagged ${val.toLowerCase()}.`); return;
  }
  if (d.cleartag){ S.eventTag = null; render(); return; }
  if (d.open){ S.sel = d.open; S.view = "person"; render(); return; }
  if (d.ev){ S.sel = d.ev; S.view = "event"; render(); return; }
  if (d.org){ S.sel = d.org; S.view = "org"; render(); return; }
  if (d.tab){ S.tab = d.tab; S.view = null; S.flow = null; S.sheet = null; S.eventTag = null; S.peerFilter = { topic: null, interest: null }; render(); return; }
  if (d.seg){ S.seg = d.seg; render(); return; }
  if (d.evseg){ S.evSeg = d.evseg; render(); return; }
  if (d.feed){ S.feed = d.feed; render(); return; }
  if (d.place){ S.place = d.place; render(); return; }
  if (d.when){ S.when = d.when; render(); return; }
  if (d.format){ S.formats[d.format] = !S.formats[d.format]; render(); return; }
  if (d.activity){
    const a = d.activity;
    if (S.mutes.activities.includes(a)) S.mutes.activities = S.mutes.activities.filter(x => x !== a);
    else S.activities[a] = !S.activities[a];
    render(); return;
  }
  if (d.genre){
    const g = d.genre;
    S.mutes.genres = S.mutes.genres.includes(g) ? S.mutes.genres.filter(x => x !== g) : S.mutes.genres.concat(g);
    render(); return;
  }
  if (d.orgstate){
    const id = d.orgstate;
    if (S.mutes.orgs.includes(id)){ S.mutes.orgs = S.mutes.orgs.filter(x => x !== id); S.follows[id] = false; }
    else if (S.follows[id]) S.follows[id] = false;
    else S.mutes.orgs.push(id);
    render(); return;
  }
  if (d.toggle){ S[d.toggle] = !S[d.toggle]; render(); return; }
  if (d.flow){ stash(); S.flow = d.flow; S.view = null; S.sheet = null; render(); return; }
  if (d.starter){
    const f = document.querySelector("#bio");
    f.value = (f.value ? f.value.replace(/\s*$/, " ") : "") + d.starter;
    S.me.bioDraft = f.value; render();
    const g = document.querySelector("#bio"); if (g){ g.focus(); g.setSelectionRange(g.value.length, g.value.length); }
    return;
  }
  if (d.topic){
    const i = S.me.topics.indexOf(d.topic);
    i >= 0 ? S.me.topics.splice(i, 1) : S.me.topics.push(d.topic);
    render(); return;
  }
  if (d.device){
    const i = S.me.devices.indexOf(d.device);
    i >= 0 ? S.me.devices.splice(i, 1) : S.me.devices.push(d.device);
    render(); return;
  }
  if (d.save){
    stash();
    const [what, arg] = d.save.split("|");
    if (what === "bio"){ S.me.bio = (S.me.bioDraft || "").trim(); S.flow = "photos"; }
    if (what === "mentor"){ S.me.mentor = arg === "yes"; S.flow = "injury"; }
    if (what === "injury"){ S.me.injuryDone = true; S.flow = "life"; }
    if (what === "life"){ S.me.lifeDone = true; S.flow = "topics"; }
    if (what === "equipment"){ S.me.equipment = (S.me.equipDraft || "").trim(); S.flow = "wish"; }
    if (what === "wish"){ S.me.wish = (S.me.wishDraft || "").trim(); S.flow = "list"; }
    render();
    if (what === "mentor") toast(arg === "yes"
      ? "Saved. You will appear in Mentors once sections are filled in."
      : "Saved as not now. Nothing else about your profile changes.");
    else toast(`Saved — profile is ${completeness()}% complete.`);
    return;
  }
  switch (d.act){
    case "close": S.view = null; S.sel = null; render(); return;
    case "closeflow": S.flow = null; render(); return;
    case "closesheet": S.sheet = null; render(); return;
    case "filters": S.eventTag = null; S.sheet = "filters"; render(); return;
    case "peerfilters": toast("Peer filters are stubbed — but tapping a topic or interest chip on a profile filters this deck."); return;
    case "reset":
      S.feed = "foryou"; S.when = "month"; S.place = "California"; S.includeOnline = true;
      Object.keys(S.formats).forEach(f => S.formats[f] = f !== "Beginner-friendly");
      Object.keys(S.activities).forEach(a => S.activities[a] = true);
      render(); toast("Filters reset. Mutes are cleared one at a time from Hidden."); return;
    case "goall": S.evSeg = "all"; render(); return;
    case "addphoto": toast("Photo picker is stubbed in this demo."); return;
    case "addtip":
      S.me.tips.push({topic:"Travel", text:"Gate-check tag on the frame and a photo of the setup on my phone. Never lost a part yet.", video:""});
      render(); toast("Tip added — tagged Travel."); return;
    case "logistics": toast("Sent to the organizer as logistics feedback. Nothing is muted."); return;
    case "undo": if (S.undo){ S.undo(); S.undo = null; S.toast = null; render(); } return;
    case "noop": render(); return;
  }
});

document.addEventListener("input", e => {
  const k = e.target.dataset.bind; if (!k) return;
  S.me[k] = e.target.value;
  if (k === "bioDraft"){
    const prev = document.querySelector(".mini-card .bio");
    if (prev) prev.textContent = e.target.value || "Your bio appears here.";
    const c = document.querySelector(".count");
    if (c){
      const w = e.target.value.trim() ? e.target.value.trim().split(/\s+/).length : 0;
      c.textContent = `${w} word${w === 1 ? "" : "s"} ${w && w < 60 ? "· fits your card" : w >= 60 ? "· the card will cut this short" : ""}`;
    }
  }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = e.target.closest('[data-wave][role="button"],[data-follow][role="button"]');
  if (t){ e.preventDefault(); t.click(); }
});

S.evSeg = "all";
/* ---------------------------------------------------------- onboarding
   Six steps: welcome, phone, code, name, disability + duration, location,
   photo. The photo is the last screen — Skip takes you straight into the
   app, and so does adding one. No interests step. */
const SETUP = ["welcome","phone","code","name","disability","location","photo"];

function setupBody(){
  const m = S.new;
  switch (SETUP[S.step]){
    case "welcome": return `<div style="text-align:center;padding-top:26px">
      <div style="display:flex;justify-content:center">${LOGO}</div>
      <h1 style="margin-top:28px;font-size:29px">A community of peers with disabilities.</h1>
      <p class="sub">Ask the questions you can't ask anyone else, and answer them for someone behind you.</p>
      <button class="btn link" data-setup="invite" style="text-decoration:underline;width:100%">I have an invite from an organization</button></div>`;

    case "phone": return `<h1>What's your number?</h1>
      <p class="sub">We use it to sign you in, and it is never shown to other members. It is also the only thing stopping automated signups.</p>
      <input class="fld" id="ph" data-newbind="phone" type="tel" inputmode="tel" value="${esc(m.phone)}" placeholder="(510) 555-0143">
      <p class="hint" style="margin-top:10px">Demo — no message is sent. Any ten digits work.</p>
      <div class="note">On a real device the number autofills and the code is read from the incoming SMS, so both of these screens take about a second.</div>`;

    case "code": return `<h1>Enter your code</h1>
      <p class="sub">We sent a 6-digit code to ${esc(m.phone || "your phone")}.</p>
      <input class="fld" id="cd" data-newbind="code" inputmode="numeric" maxlength="6" value="${esc(m.code)}"
        placeholder="000000" style="letter-spacing:.45em;text-align:center;font-size:23px;font-weight:700">
      <p class="hint" style="margin-top:12px">Any six digits will do here.</p>`;

    case "name": return `<h1>What should people call you?</h1>
      <p class="sub">This is the name on your profile.</p>
      <input class="fld" id="nm" data-newbind="name" value="${esc(m.name)}" placeholder="Alex R.">
      <p class="hint" style="margin-top:10px">First name and last initial is plenty.</p>`;

    case "disability": return `<h1>What's your disability?</h1>
      <p class="sub">The most-used filter. Pick the closest match.</p>
      <div class="chips">${["SCI - para","SCI - quad","TBI","Spina Bifida","Cerebral Palsy","Amputee","MS","Other"]
        .map(x => `<button class="chip ${m.disability === x ? "on" : ""}" data-newpick="disability|${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <h3 class="sec">How long have you been disabled?</h3>
      <div class="chips">${["Since birth","Less than 6 months","6–12 months","1–3 years","3–10 years","10+ years"]
        .map(x => `<button class="chip ${m.duration === x ? "on" : ""}" data-newpick="duration|${esc(x)}">${esc(x)}</button>`).join("")}</div>`;

    case "location": return `<h1>Where do you live?</h1>
      <p class="sub">We show peers and events in your state first.</p>
      <button class="btn solid" style="width:100%;min-height:50px" data-setup="geo">Use my location</button>
      <p class="hint" style="text-align:center;margin:9px 0 4px">or choose yourself</p>
      <h3 class="sec">State</h3>
      <div class="chips">${["California","Arizona","Idaho","Colorado"]
        .map(x => `<button class="chip ${m.state === x ? "on" : ""}" data-newpick="state|${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <button class="row" data-act="noop" style="margin-top:14px">
        <span><span class="nm">Show me in browse</span><span class="s">You can turn this off any time</span></span>
        <span class="sw on"><i></i></span></button>
      <div class="note">The location prompt fires from the button, so the reason is on screen when it appears. Coordinates are converted to a city and thrown away.</div>`;

    case "photo": return `<h1>Add a photo?</h1>
      <p class="sub">Optional, and never required. A face makes it feel like a community rather than a directory.</p>
      <button class="drop" data-setup="pickphoto" style="width:150px;height:150px;border-radius:44px;border:2.5px dashed var(--pine);
        margin:22px auto 0;display:grid;place-items:center;background:${m.photo ? "var(--pine)" : "#fff"};color:${m.photo ? "#fff" : "var(--pine)"}">
        ${m.photo ? `<span style="font-family:var(--head);font-weight:800;font-size:34px">${esc((m.name || "A").slice(0,2).toUpperCase())}</span>` : PLUS}</button>
      <p class="hint" style="text-align:center;margin-top:16px">Pick one from your camera roll or take a new one. You can add or change it any time.</p>
      <div class="note">Skipping leaves no visible hole — the generated tile reads as a design choice, not a missing image.</div>`;
  }
}

function canNext(){
  const m = S.new;
  switch (SETUP[S.step]){
    case "phone": return (m.phone || "").replace(/\D/g, "").length >= 10;
    case "code": return (m.code || "").replace(/\D/g, "").length === 6;
    case "name": return (m.name || "").trim().length > 0;
    case "disability": return !!m.disability && !!m.duration;
    case "location": return !!m.state;
    default: return true;
  }
}

function setupView(){
  const stepNo = S.step - 2, showProg = S.step >= 3, last = SETUP[S.step] === "photo";
  return `<div class="screen">
    ${showProg
      ? `<div class="prog"><div class="r"><span class="nm">PeerConnect</span><span class="ct">Step ${stepNo} of 4</span></div>
         <div class="track"><i style="width:${stepNo / 4 * 100}%"></i></div></div>`
      : `<div style="height:18px"></div>`}
    <div class="scroll" style="padding:0 20px 14px">
      ${S.step > 0 ? `<button class="back" data-setup="back">← Back</button>` : ""}
      ${setupBody()}
      <div style="height:12px"></div>
    </div>
    <footer class="cta">
      <button class="btn solid" data-setup="next" ${canNext() ? "" : "disabled style=opacity:.45"}>
        ${S.step === 0 ? "Get started" : S.step < 3 ? "Next" : last ? "Finish" : "Continue"}</button>
    </footer>
    ${last ? `<div style="padding:0 20px 14px"><button class="btn link" data-setup="skipphoto" style="width:100%">Skip for now</button></div>` : ""}
  </div>`;
}

const LOGO = `<svg width="112" height="112" viewBox="0 0 120 120" aria-hidden="true">
 <circle cx="60" cy="60" r="42" fill="none" stroke="#14483C" stroke-width="4.5"/>
 <g stroke="#14483C" stroke-width="3.2" stroke-linecap="round">
  <path d="M80 60h14"/><path d="M74.1 74.1 84 84"/><path d="M60 80v14"/><path d="M45.9 74.1 36 84"/>
  <path d="M40 60H26"/><path d="M45.9 45.9 36 36"/><path d="M60 40V26"/><path d="M74.1 45.9 84 36"/></g>
 <g fill="#14483C"><circle cx="102" cy="60" r="6.5"/><circle cx="60" cy="102" r="6.5"/>
  <circle cx="18" cy="60" r="6.5"/><circle cx="30.3" cy="30.3" r="6.5"/><circle cx="89.7" cy="30.3" r="6.5"/></g>
 <g fill="#C9491B"><circle cx="60" cy="18" r="7.5"/><circle cx="30.3" cy="89.7" r="7.5"/></g>
 <rect x="82.4" y="82.4" width="14.6" height="14.6" rx="3.6" fill="#14483C"/>
 <path d="M60 76s13-11.4 13-21a13 13 0 1 0-26 0c0 9.6 13 21 13 21Z" fill="#C9491B"/>
 <circle cx="60" cy="54.4" r="4.8" fill="#EFF2EE"/></svg>`;

function finishSetup(msg){
  S.setup = false;
  if (S.new.name) me().name = S.new.name;
  if (S.new.state) S.place = S.new.state === "Arizona" ? "Arizona" : "California";
  if (["Less than 6 months","6–12 months"].includes(S.new.duration)) S.seg = "mentors";
  render();
  toast(msg);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-setup],[data-newpick]");
  if (!t) return;
  const d = t.dataset;
  const stash = () => document.querySelectorAll("[data-newbind]").forEach(f => { S.new[f.dataset.newbind] = f.value; });
  if (d.newpick){
    const [k, v] = d.newpick.split("|");
    S.new[k] = v; render(); return;
  }
  switch (d.setup){
    case "next":
      stash();
      if (SETUP[S.step] === "photo"){ finishSetup("You're in. Add interests any time from Me — or just tag a photo."); return; }
      S.step++; render(); return;
    case "back": stash(); S.step = Math.max(0, S.step - 1); render(); return;
    case "invite":
      S.new.invitedBy = "NorCal SCI"; S.step = 3; render();
      toast("Invite from NorCal SCI — phone verification skipped."); return;
    case "geo": S.new.state = "California"; render(); toast("Converted to San Jose, California. Coordinates discarded."); return;
    case "pickphoto": S.new.photo = !S.new.photo; render(); return;
    case "skipphoto":
      finishSetup("You're in. No photo, no hole — your tile is generated from your initials.");
      return;
  }
});

document.addEventListener("input", e => {
  const k = e.target.dataset.newbind; if (!k) return;
  S.new[k] = e.target.value;
  const b = document.querySelector('[data-setup="next"]');
  if (b){ b.disabled = !canNext(); b.style.opacity = canNext() ? "" : ".45"; }
});

render();
</script></body></html>
