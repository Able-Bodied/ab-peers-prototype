<!--
  PROTOTYPE — INTERNAL DEMO ONLY. DO NOT COMMIT TO A PUBLIC REPO.
  The Peers tab renders 25 real, named people from NorCal SCI's public mentor page.
  Their consent column reads "NOT OBTAINED". They are shown as unclaimed listings with
  contact routed to NorCal SCI's coordinator, which is how that page works today.
  Photos are hotlinked from NorCal's CDN and some filenames contain surnames.
-->
<style>
:root{
  --canvas:#EFF2EE; --paper:#fff; --ink:#111A16; --ink2:#46524C;
  --pine:#14483C; --pine-hi:#1B5F4E; --tint:#DDE9E3; --clay:#C9491B; --clay-t:#FBE7DE;
  --line:#C9D2CC; --grey:#8A968F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:#DCE2DB;font-family:"Public Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);display:flex;align-items:center;justify-content:center}
#phone{width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--canvas);
  display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(17,26,22,.25)}
#root{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
@media(min-width:520px){#phone{border-radius:30px;height:min(900px,calc(100dvh - 40px))}}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top */
.top{flex:none;display:flex;gap:9px;align-items:center;padding:14px 18px 10px}
.seg{min-height:44px;padding:0 22px;border-radius:22px;border:2px solid var(--line);background:var(--paper);
  font-family:Archivo;font-weight:700;font-size:16px;color:var(--ink)}
.seg[aria-selected="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.icb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--paper);
  display:grid;place-items:center;flex:none;margin-left:auto}

/* deck */
.deck{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;padding:0 16px 12px}
.card{position:relative;width:100%;height:calc(100% - 8px);min-height:470px;border-radius:26px;overflow:hidden;
  scroll-snap-align:center;margin-bottom:14px;background:#274b66;display:block;text-align:left;border:0;padding:0}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .init{position:absolute;inset:0;display:grid;place-items:center;font-family:Archivo;font-weight:800;
  font-size:120px;color:rgba(255,255,255,.55)}
body.nophoto #phone::after{content:"Photos blocked here — open the file directly in a browser";
  position:absolute;left:16px;right:16px;top:6px;z-index:99;background:#C9491B;color:#fff;
  font-size:11.5px;font-weight:700;text-align:center;padding:6px 10px;border-radius:9px}
.card .scrim{position:absolute;left:0;right:0;bottom:0;height:56%;
  background:linear-gradient(to top,rgba(8,14,11,.92) 12%,rgba(8,14,11,.55) 42%,transparent)}
.card .scrim-top{position:absolute;left:0;right:0;top:0;height:34%;
  background:linear-gradient(to bottom,rgba(8,14,11,.62),transparent)}
.card .head{position:absolute;top:22px;left:24px;right:24px;color:#fff}
.card .head h2{font-family:Archivo;font-size:30px;margin:0 0 8px;letter-spacing:-.02em}
.card .head .l{font-size:14.5px;color:#e6ece8;margin-bottom:3px}
.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
.obadge{display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:14px;
  padding:5px 12px 5px 9px;max-width:100%}
.obadge img{height:17px;width:auto;max-width:96px;object-fit:contain;display:block}
.obadge b{font-size:11.5px;font-weight:700;color:var(--pine);white-space:nowrap}
.pillw{display:inline-block;background:#fff;color:var(--pine);font-size:11.5px;font-weight:700;
  padding:6px 12px;border-radius:14px}
.pillw.warn{background:var(--clay);color:#fff;margin-top:0}
.card .foot{position:absolute;left:24px;right:24px;bottom:22px;color:#fff}
.card .bio{font-size:14.5px;line-height:1.42;max-width:64%;margin:0 0 14px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chipstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chipstrip::-webkit-scrollbar{display:none}
.chipstrip span{flex:none;background:#fff;color:var(--ink);font-size:12.5px;font-weight:700;
  padding:9px 15px;border-radius:19px}
.wave{position:absolute;right:20px;bottom:76px;width:76px;height:76px;border-radius:50%;border:0;
  background:var(--clay);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.wave.done{background:var(--pine)}
.wave svg{width:38px;height:38px}

/* detail + generic pages */
.page{position:absolute;inset:0;background:var(--canvas);display:flex;flex-direction:column;z-index:10}
.page .scroll{flex:1;min-height:0;overflow-y:auto;padding:0 20px 22px}
.back{background:none;border:0;color:var(--pine);font-weight:700;font-size:15px;padding:14px 0 6px}
.hero{position:relative;height:330px;border-radius:22px;overflow:hidden;margin-bottom:16px;background:#274b66}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .init{position:absolute;inset:0;display:grid;place-items:center;font-family:Archivo;font-weight:800;
  font-size:96px;color:rgba(255,255,255,.55)}
h1{font-family:Archivo;font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.meta{font-size:14.5px;color:var(--ink2);line-height:1.45}
h3.sec{font-family:Archivo;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink2);margin:24px 0 4px}
.hint{font-size:13px;color:var(--ink2);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:2px solid var(--line);background:var(--paper);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.chip.on{border-color:var(--pine);background:var(--tint);color:var(--pine)}
.chip.ask{border-color:var(--pine);color:var(--pine);background:var(--tint)}
.chip.find{border-style:dashed}
.note{background:var(--tint);border-radius:13px;padding:13px 15px;font-size:13.5px;line-height:1.45;margin:14px 0}
.note.warn{background:var(--clay-t);color:#5C2410}
dl{margin:6px 0 0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv dt{color:var(--ink2);font-weight:600;flex:none;max-width:44%}
.kv dd{margin:0;text-align:right;font-weight:700}
footer.cta{flex:none;padding:12px 20px max(14px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--canvas) 72%,rgba(239,242,238,0))}
.btn{width:100%;min-height:56px;border-radius:14px;border:0;background:var(--pine);color:#fff;
  font-family:Archivo;font-size:17px;font-weight:700}
.btn[disabled]{background:#B4C0BA;color:#5C6862;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pine);border:2px solid var(--pine)}
.btn.link{background:none;color:var(--ink2);min-height:42px;font-family:"Public Sans";font-size:14.5px;font-weight:700}

/* events */
.ev{width:100%;text-align:left;background:var(--paper);border:1.6px solid var(--line);border-radius:16px;
  padding:15px;margin-bottom:13px;display:flex;gap:14px}
.date{width:62px;height:62px;border-radius:13px;background:var(--tint);flex:none;display:flex;
  flex-direction:column;align-items:center;justify-content:center;color:var(--pine)}
.date b{font-family:Archivo;font-size:21px;line-height:1}
.date i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px;margin-left:6px}
.badge.v{background:var(--clay);color:#fff}
.badge.r{background:var(--tint);color:var(--pine)}
.tag{font-size:12.5px;font-weight:700;color:var(--pine);margin-top:8px}

/* nav */
nav{flex:none;margin:0 16px max(12px,env(safe-area-inset-bottom));background:var(--paper);
  border:1.6px solid var(--line);border-radius:24px;display:flex;padding:9px 0}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10.5px;font-weight:700;color:var(--grey);padding:2px 0}
nav button[aria-current="page"]{color:var(--pine)}
nav .ic{width:22px;height:22px}
.badge-n{position:absolute;transform:translate(12px,-6px);background:var(--clay);color:#fff;
  border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--pine);color:#fff;border-radius:13px;
  padding:13px 16px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.prog{flex:none;padding:14px 20px 0}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.prog .nm{font-family:Archivo;font-size:13px;font-weight:700;color:var(--pine)}
.prog .ct{font-size:12.5px;font-weight:600;color:var(--ink2)}
.track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--pine);border-radius:3px;transition:width .3s}
.big{font-family:Archivo;font-size:29px;line-height:1.1;letter-spacing:-.025em;margin:14px 0 10px}
.sub{font-size:15.5px;line-height:1.45;color:var(--ink2);margin:0 0 22px}
.drop{width:150px;height:150px;border-radius:44px;border:2.5px dashed var(--pine);margin:22px auto 0;
  display:grid;place-items:center;cursor:pointer;background:#fff;background-size:cover;background-position:center}
.fld{width:100%;min-height:54px;border-radius:12px;border:2px solid var(--line);background:#fff;
  padding:0 16px;font:inherit;font-size:16.5px}
.seednote{flex:none;margin:0 18px 10px;background:var(--tint);border-radius:12px;padding:10px 13px;
  font-size:12.5px;line-height:1.4;color:var(--ink)}
.fbar{flex:none;display:flex;gap:8px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:2px solid var(--pine);
  background:var(--tint);color:var(--pine);font-size:13px;font-weight:700}
.empty{text-align:center;padding:60px 20px;color:var(--ink2)}
.empty b{display:block;font-family:Archivo;font-size:19px;color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>

const S = { seg:"peers", tab:"discover", view:null, sel:null, waves:{}, rsvps:{}, toast:null,
  filters:{ interest:null, org:null, topic:null },
  setup:true, step:0, me:{ name:"", disability:"SCI - para", duration:"3 - 10 years",
                   state:"California", interests:[] } };

const HAND = `<svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
 <rect x="12" y="4" width="5" height="19" rx="2.5" fill="#fff"/>
 <rect x="18" y="2" width="5" height="21" rx="2.5" fill="#fff"/>
 <rect x="24" y="4" width="5" height="19" rx="2.5" fill="#fff"/>
 <rect x="6" y="12" width="5" height="13" rx="2.5" fill="#fff" transform="rotate(-18 8 18)"/>
 <rect x="9" y="17" width="22" height="17" rx="8" fill="#fff"/>
 <path d="M33 12a9 9 0 0 1 0 12M36.5 9a13 13 0 0 1 0 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>`;

const MAG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.6" stroke-linecap="round" style="margin-left:6px;opacity:.55"><circle cx="11" cy="11" r="7"/>
  <path d="m20 20-3.5-3.5"/></svg>`;

function orgBadge(p, dark){
  if(!p.isMentor) return "";
  const logo = DATA.orgLogos[p.mentorOrg];
  return `<span class="obadge"><img src="${logo}" alt="${esc(p.mentorOrg)}" referrerpolicy="no-referrer"
      onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'${esc(p.mentorOrg)}'}))">
    <b>Trained mentor</b></span>`;
}

const shared = p => (p.interests||[]).filter(i=>S.me.interests.includes(i));
const isNew = () => ["Less than 6 months","6 - 12 months"].includes(S.me.duration);

function photo(p){
  // initials sit underneath as the fallback; the photo paints over them when it loads
  const fb = `<div class="init">${esc(ini(p.name))}</div>`;
  if(!p.photo) return fb;
  return fb + `<img src="${p.photo}" alt="" style="object-position:${p.focal}"
     referrerpolicy="no-referrer" loading="lazy"
     onerror="this.remove();document.body.classList.add('nophoto')">`;
}

/* ------------------------------------------------------------ setup */
const LOGO = `<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
 <circle cx="60" cy="60" r="42" fill="none" stroke="#14483C" stroke-width="4.5"/>
 <g stroke="#14483C" stroke-width="3.2" stroke-linecap="round">
  <path d="M80 60h14"/><path d="M74.1 74.1 84 84"/><path d="M60 80v14"/><path d="M45.9 74.1 36 84"/>
  <path d="M40 60H26"/><path d="M45.9 45.9 36 36"/><path d="M60 40V26"/><path d="M74.1 45.9 84 36"/></g>
 <g fill="#14483C"><circle cx="102" cy="60" r="6.5"/><circle cx="60" cy="102" r="6.5"/>
  <circle cx="18" cy="60" r="6.5"/><circle cx="30.3" cy="30.3" r="6.5"/><circle cx="89.7" cy="30.3" r="6.5"/></g>
 <g fill="#C9491B"><circle cx="60" cy="18" r="7.5"/><circle cx="30.3" cy="89.7" r="7.5"/></g>
 <rect x="82.4" y="82.4" width="14.6" height="14.6" rx="3.6" fill="#14483C"/>
 <path d="M60 76s13-11.4 13-21a13 13 0 1 0-26 0c0 9.6 13 21 13 21Z" fill="#C9491B"/>
 <circle cx="60" cy="54.4" r="4.8" fill="#EFF2EE"/></svg>`;

const digits = v => (v||"").replace(/\D/g,"");

function canNext(){
  const m = S.me;
  switch(S.step){
    case 1: return digits(m.phone).length >= 10;
    case 2: return digits(m.code).length === 6;
    case 3: return m.name.trim().length > 0;
    case 4: return !!m.disability && !!m.duration;
    case 5: return !!m.state;
    default: return true;
  }
}

function stepBody(){
  const m = S.me;
  switch(S.step){
    case 0: return `<div style="text-align:center;padding-top:22px">
      <div style="display:flex;justify-content:center">${LOGO}</div>
      <h1 class="big" style="margin-top:30px">A community of peers with disabilities.</h1>
      <p class="sub">Ask the questions you can't ask anyone else, and answer them for someone behind you.</p>
      <button class="btn link" data-act="invite" style="text-decoration:underline">
        I have an invite from an organization</button></div>`;
    case 1: return `<h1 class="big">What's your number?</h1>
      <p class="sub">We use it to sign you in, and it is never shown to other members. It is also the
        only thing stopping automated signups.</p>
      <input id="ph" class="fld" type="tel" inputmode="tel" value="${esc(m.phone)}"
        placeholder="(510) 555-0143" data-bind="phone">
      <p class="hint" style="margin-top:10px">Prototype — no message is actually sent. Any ten digits work.</p>
      <div class="note">On a real device the number autofills and the code is read from the incoming
        SMS, so both of these screens take about a second.</div>`;
    case 2: return `<h1 class="big">Enter your code</h1>
      <p class="sub">We sent a 6-digit code to ${esc(m.phone||"your phone")}.</p>
      <input id="cd" class="fld" type="text" inputmode="numeric" maxlength="6" value="${esc(m.code)}"
        placeholder="000000" data-bind="code"
        style="letter-spacing:.45em;text-align:center;font-size:23px;font-weight:700">
      <p class="hint" style="margin-top:12px">Any six digits will do here.</p>
      <button class="btn link" data-act="resend" style="margin-top:4px">Didn't get it? Resend</button>`;
    case 3: return `<h1 class="big">What should people call you?</h1>
      <p class="sub">This is the name on your profile.</p>
      <input id="nm" class="fld" value="${esc(m.name)}" placeholder="Alex R." data-bind="name">
      <p class="hint" style="margin-top:10px">First name and last initial is plenty.</p>`;
    case 4: return `<h1 class="big">What's your disability?</h1>
      <p class="sub">The most-used filter. Pick the closest match.</p>
      <div class="chips">${DATA.disabilities.map(x=>`<button class="chip ${m.disability===x?"on":""}" data-d="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <h3 class="sec">How long have you been disabled?</h3>
      <div class="chips">${DATA.durations.map(x=>`<button class="chip ${m.duration===x?"on":""}" data-du="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
    case 5: return `<h1 class="big">Where do you live?</h1>
      <p class="sub">We show peers and events in your state first.</p>
      <div class="chips">${DATA.states.map(x=>`<button class="chip ${m.state===x?"on":""}" data-st="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div class="note">Everyone in this build is listed in California or Idaho, so the filter is
        showing rather than hiding here.</div>`;
    case 6: return `<h1 class="big">Add a photo?</h1>
      <p class="sub">Optional. A face makes it feel like a community rather than a directory.</p>
      <div class="drop" id="drop" role="button" tabindex="0"
        style="${m.photo?`background-image:url(${m.photo});border-style:solid`:""}">
        ${m.photo?"":`<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#14483C"
          stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`}</div>
      <input type="file" id="file" accept="image/*" class="sr">
      <p class="hint" style="text-align:center;margin-top:16px">Pick one from your camera roll or take
        a new one. You can add or change it anytime.</p>
      ${m.photo?`<button class="btn link" data-act="rmphoto">Remove photo</button>`:""}`;
    case 7: return `<h1 class="big">What are you into?</h1>
      <p class="sub">Optional. These drive the "also into" line on every card.</p>
      <div class="chips">${DATA.interestPool.map(x=>`<button class="chip ${m.interests.includes(x)?"on":""}" data-i="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
  }
}

function setupView(){
  const n = S.step - 2;                       // phone and code are not counted as steps
  const showProg = S.step >= 3;
  const last = S.step === 7;
  return `<div class="screen">
    ${showProg ? `<div class="prog"><div class="row"><span class="nm">PeerConnect</span>
      <span class="ct">Step ${n} of 5</span></div>
      <div class="track"><i style="width:${n/5*100}%"></i></div></div>` : `<div style="height:18px"></div>`}
    <div class="deck" style="scroll-snap-type:none;padding:0 20px 14px">
      ${S.step>0?`<button class="back" data-act="back">&larr; Back</button>`:""}
      ${stepBody()}
      <div style="height:12px"></div>
    </div>
    <footer class="cta">
      <button class="btn" data-act="next" ${canNext()?"":"disabled"}>${
        S.step===0?"Get started":S.step<3?"Next":last?"Start browsing":"Continue"}</button>
      ${(S.step===6||last)?`<button class="btn link" data-act="next">Skip for now</button>`:""}
    </footer></div>`;
}

/* ------------------------------------------------------------ deck */
function deck(){
  let list = DATA.people.slice();
  if(S.seg==="mentors") list = list.filter(p=>p.isMentor);
  if(S.filters.interest) list = list.filter(p=>p.interests.includes(S.filters.interest));
  if(S.filters.org) list = list.filter(p=>p.affiliation.includes(S.filters.org));
  if(S.filters.topic) list = list.filter(p=>p.topics.includes(S.filters.topic)||p.devices.includes(S.filters.topic));
  list.sort((a,b)=>shared(b).length-shared(a).length);
  if(!list.length) return `<div class="empty"><b>Nobody here yet</b>
    No one in ${S.seg==="mentors"?"Mentors":"Peers"} matches that.
    <div style="margin-top:16px"><button class="btn ghost" data-act="clearf">Clear filters</button></div></div>`;
  return list.map(p=>{
    const sh = shared(p), w = S.waves[p.id];
    const bits = [p.injury==="N/A - family member" ? "Family member" : p.injury,
                  p.level, p.chair].filter(Boolean).join("  ·  ");
    const loc = [p.city, p.state].filter(Boolean).join(", ");
    return `<button class="card" data-open="${p.id}">
      ${photo(p)}
      <div class="scrim-top"></div><div class="scrim"></div>
      <div class="head">
        <h2>${esc(p.name)}</h2>
        <div class="l">${esc(bits)}</div>
        <div class="l">${p.age?esc(p.age)+"  ·  ":""}${esc(loc)}</div>
        <div class="badges">${orgBadge(p)}<span class="pillw warn">Unclaimed</span></div>
      </div>
      <div class="foot">
        <p class="bio">${esc(p.bio)}</p>
        <div class="chipstrip">${(sh.length?sh:p.interests).slice(0,6).map(i=>`<span>${esc(i)}</span>`).join("")}</div>
      </div>
      <span class="wave ${w?"done":""}" data-wave="${p.id}" role="button" tabindex="0"
        aria-label="Ask NorCal SCI to connect you with ${esc(p.name)}">${HAND}</span>
    </button>`;
  }).join("");
}

function activeFilters(){
  const f = [];
  if(S.filters.interest) f.push(["interest", "Into " + S.filters.interest.toLowerCase()]);
  if(S.filters.org) f.push(["org", S.filters.org]);
  if(S.filters.topic) f.push(["topic", "Talks about " + S.filters.topic.toLowerCase()]);
  if(!f.length) return "";
  return `<div class="fbar">${f.map(([k,label])=>`
    <button class="fchip" data-clear="${k}">${esc(label)} <span aria-hidden="true">&times;</span>
      <span class="sr">Remove filter</span></button>`).join("")}</div>`;
}

function discover(){
  return `<div class="top">
      <button class="seg" role="tab" aria-selected="${S.seg==="peers"}" data-seg="peers">Peers</button>
      <button class="seg" role="tab" aria-selected="${S.seg==="mentors"}" data-seg="mentors">Mentors</button>
      <button class="icb" data-act="filters" aria-label="Filters">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111A16" stroke-width="2" stroke-linecap="round">
          <path d="M3 7h18M3 12h18M3 17h18"/><circle cx="9" cy="7" r="2.4" fill="#fff"/>
          <circle cx="15" cy="12" r="2.4" fill="#fff"/><circle cx="8" cy="17" r="2.4" fill="#fff"/></svg>
      </button></div>
    ${activeFilters()}
    ${S.seg==="peers"&&!S.filters.interest&&!S.filters.org&&!S.filters.topic
      ? `<div class="seednote">Every profile here is one of NorCal SCI's 25 trained mentors.
         Ordinary peers appear as people sign up.</div>` : ""}
    <div class="deck" id="deck">${deck()}</div>`;
}

/* ------------------------------------------------------------ profile */
function profile(){
  const p = DATA.people.find(x=>x.id===S.sel);
  const sh = shared(p), w = S.waves[p.id];
  const loc = [p.city, p.state].filter(Boolean).join(", ");
  return `<div class="page">
    <div class="scroll">
      <button class="back" data-act="close">&larr; Back</button>
      <div class="hero">${photo(p)}</div>
      <h1>${esc(p.name)}</h1>
      <div class="meta">${[p.injury==="N/A - family member"?"Family member":p.injury, p.level,
        p.completeness&&p.completeness!=="Do Not Know"?p.completeness.toLowerCase():null].filter(Boolean).join("  ·  ")}</div>
      <div class="meta">${p.age?esc(p.age)+"  ·  ":""}${esc(loc)}</div>
      <div class="badges" style="margin-top:12px">${orgBadge(p)}</div>
      <div class="note warn"><b>Unclaimed listing.</b> ${esc(p.name)} is published on NorCal SCI's
        public mentor page and has not signed up here. Contact goes through their coordinator,
        exactly as it does today.</div>
      ${p.bio?`<p style="font-size:15px;line-height:1.5;margin:16px 0 0">${esc(p.bio)}</p>`:""}
      ${sh.length?`<div class="note">You both like <b>${esc(sh.join(", ").toLowerCase())}</b>.</div>`:""}
      ${p.topics.length?`<h3 class="sec">Ask me about</h3>
        <p class="hint">Tap one to find everyone who talks about it.</p>
        <div class="chips">${p.topics.map(t=>`<button class="chip find" data-ftopic="${esc(t)}">${esc(t)}${MAG}</button>`).join("")}</div>`:""}
      ${p.interests.length?`<h3 class="sec">Interests</h3>
        <p class="hint">Tap one to see everyone else into the same thing.</p>
        <div class="chips">${p.interests.map(t=>`<button class="chip find ${S.me.interests.includes(t)?"on":""}" data-fint="${esc(t)}">${esc(t)}${MAG}</button>`).join("")}</div>
        ${p.interestsRaw?`<p class="hint" style="margin-top:10px">In their words: ${esc(p.interestsRaw)}</p>`:""}`:""}
      ${p.devices.length?`<h3 class="sec">Comfortable discussing</h3>
        <div class="chips">${p.devices.map(t=>`<button class="chip find" data-ftopic="${esc(t)}">${esc(t)}${MAG}</button>`).join("")}</div>`:""}
      <h3 class="sec">Details</h3>
      <dl>
        ${p.chair?`<div class="kv"><dt>Uses</dt><dd>${esc(p.chair)}</dd></div>`:""}
        <div class="kv"><dt>Time since injury</dt><dd style="font-weight:600;color:var(--ink2)">Not published</dd></div>
        ${p.languages.length?`<div class="kv"><dt>Languages</dt><dd>${esc(p.languages.join(", "))}</dd></div>`:""}
        ${p.independence?`<div class="kv"><dt>Independence</dt><dd>${esc(p.independence)}</dd></div>`:""}
        ${p.education?`<div class="kv"><dt>Education</dt><dd>${esc(p.education)}</dd></div>`:""}
        ${p.field?`<div class="kv"><dt>Work</dt><dd>${esc(p.field)}</dd></div>`:""}
        ${p.affiliation.length?`<div class="kv"><dt>Affiliation</dt><dd style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          ${p.affiliation.map(a=>`<button class="chip find" style="min-height:30px;font-size:12px" data-forg="${esc(a)}">${esc(a)}</button>`).join("")}</dd></div>`:""}
      </dl>
      <div style="height:10px"></div>
    </div>
    <footer class="cta">
      <button class="btn ${w?"ghost":""}" data-wave="${p.id}">${w?"Request sent":"Ask NorCal SCI to connect us"}</button>
    </footer></div>`;
}

/* ------------------------------------------------------------ events */
function events(){
  const list = DATA.events.slice();
  const virt = list.filter(e=>e.mode==="virtual").length;
  return `<div class="top"><span style="font-family:Archivo;font-weight:800;font-size:24px">Events</span></div>
    <div class="deck" style="scroll-snap-type:none;padding:0 20px 12px">
      <div class="note">Showing <b>${esc(S.me.state)}</b> plus ${virt} online, which anyone can join.</div>
      ${list.map(e=>`<button class="ev" data-ev="${e.id}">
        <div class="date"><i>${esc(e.day)}</i><b>${esc(e.num)}</b></div>
        <div style="flex:1;min-width:0">
          <div style="font-family:Archivo;font-weight:700;font-size:16px">${esc(e.title)}${
            e.mode==="virtual"?`<span class="badge v">Online</span>`:""}${e.recurring?`<span class="badge r">Recurring</span>`:""}</div>
          <div class="meta" style="font-size:13px">${esc(e.org)} · ${esc(e.city)}<br>${esc(e.time)}</div>
          <div class="tag">${e.going} going${S.rsvps[e.id]?" · You're going":""}</div>
        </div></button>`).join("")}
    </div>`;
}

function eventDetail(){
  const e = DATA.events.find(x=>x.id===S.sel), going = S.rsvps[e.id];
  return `<div class="page"><div class="scroll">
      <button class="back" data-act="close">&larr; Back</button>
      <h1 style="margin-top:10px">${esc(e.title)}</h1>
      <p style="font-weight:700;color:var(--pine);margin:0 0 4px">${esc(e.day)} ${esc(e.num)} · ${esc(e.time)}</p>
      <div class="meta">${esc(e.org)} · ${esc(e.city)}${e.mode==="virtual"?"":", "+esc(e.state)}</div>
      <p style="font-size:15px;line-height:1.5">${esc(e.desc)}</p>
      <div class="note"><b>${e.going + (going?1:0)} going</b></div>
      <h3 class="sec">Access</h3><p style="font-size:14.5px;line-height:1.5;margin:0">${esc(e.access)}</p>
      ${e.mode==="virtual"?`<h3 class="sec">Joining</h3>${going
        ? `<div class="note">Your link: <b>meet.peerconnect.app/${esc(e.id)}-8842</b></div>`
        : `<div class="note warn">The join link appears once you RSVP. Links are never public —
             it keeps groups from being crashed.</div>`}`:""}
      <div style="height:10px"></div></div>
    <footer class="cta"><button class="btn ${going?"ghost":""}" data-rsvp="${e.id}">${
      going?"You're going — cancel":"RSVP"}</button></footer></div>`;
}

function simple(title, body){
  return `<div class="top"><span style="font-family:Archivo;font-weight:800;font-size:24px">${title}</span></div>
    <div class="deck" style="scroll-snap-type:none;padding:0 20px">${body}</div>`;
}

function chats(){
  const ids = Object.keys(S.waves);
  return simple("Chats", ids.length
    ? `<div class="note">These are connection requests, not live threads — everyone here is an
        unclaimed listing, so NorCal SCI's coordinator makes the introduction.</div>` +
      ids.map(id=>{const p=DATA.people.find(x=>x.id===id);
        return `<button class="ev" data-open="${p.id}">
          <div class="date" style="background:${p.color};color:#fff"><b>${esc(ini(p.name))}</b></div>
          <div style="flex:1"><div style="font-family:Archivo;font-weight:700;font-size:16px">${esc(p.name)}</div>
          <div class="meta" style="font-size:13px">Request sent via NorCal SCI</div></div></button>`;}).join("")
    : `<div class="empty"><b>Nothing yet</b>Tap the wave on a card to ask for an introduction.</div>`);
}

function me(){
  return simple("Me", `
    <div class="note">Prototype — nothing is saved. Reload to start over.</div>
    ${S.me.photo?`<div style="display:flex;justify-content:center;margin:6px 0 4px">
      <div style="width:110px;height:110px;border-radius:32px;background-image:url(${S.me.photo});
        background-size:cover;background-position:center"></div></div>`:""}
    <h3 class="sec">You</h3>
    <dl><div class="kv"><dt>Name</dt><dd>${esc(S.me.name||"Not set")}</dd></div>
      <div class="kv"><dt>Disability</dt><dd>${esc(S.me.disability)}</dd></div>
      <div class="kv"><dt>Time since</dt><dd>${esc(S.me.duration)}</dd></div>
      <div class="kv"><dt>State</dt><dd>${esc(S.me.state)}</dd></div>
      <div class="kv"><dt>Joined via</dt><dd>${S.me.invitedBy?esc(S.me.invitedBy)+" invite":"Phone verification"}</dd></div></dl>
    <h3 class="sec">Interests</h3>
    <div class="chips">${S.me.interests.length?S.me.interests.map(i=>`<span class="chip on">${esc(i)}</span>`).join("")
      :`<span class="meta">None picked</span>`}</div>
    <div style="height:18px"></div>
    <button class="btn ghost" data-act="resetup">Change my answers</button>
    <h3 class="sec">About this data</h3>
    <p class="meta">The 25 people in Peers are real, published on NorCal SCI's public mentor page.
      Their consent column reads <b>not obtained</b> — they have not signed up here. They appear as
      unclaimed listings with contact routed to NorCal SCI, which is how that page works today.
      Events and the rest are invented.</p>
    <div style="height:20px"></div>`);
}

const NAV = [["discover","Discover"],["events","Events"],["chats","Chats"],["me","Me"]];
function nav(){
  const n = Object.keys(S.waves).length;
  return `<nav>${NAV.map(([k,l])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">${
      k==="discover"?`<circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/><circle cx="12" cy="12" r="2" fill="currentColor"/>`
      :k==="events"?`<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>`
      :k==="chats"?`<path d="M20.5 12a8 8 0 1 1-3.2-6.4"/><path d="M4 20l1.6-4"/><circle cx="12" cy="12" r="1" fill="currentColor"/>`
      :`<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.9 3.5-6 7-6s6.2 2.1 7 6"/>`}
    </svg>${k==="chats"&&n?`<span class="badge-n">${n}</span>`:""}</span>${l}</button>`).join("")}</nav>`;
}

function wirePhoto(){
  const drop = $("#drop"), file = $("#file");
  if(!drop || !file) return;
  const pick = () => file.click();
  drop.onclick = pick;
  drop.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } };
  file.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { S.me.photo = r.result; render(); };
    r.readAsDataURL(f);
  };
}

function render(){
  if(S.setup){ $("#root").innerHTML = setupView(); wirePhoto(); return; }
  let body = S.tab==="discover"?discover():S.tab==="events"?events():S.tab==="chats"?chats():me();
  $("#root").innerHTML = `<div class="screen">${body}${nav()}</div>
    ${S.view==="profile"?profile():S.view==="event"?eventDetail():""}
    ${S.toast?`<div class="toast">${esc(S.toast)}</div>`:""}`;
  const dk = $("#deck");
  if(dk && S.tab==="discover") attachSwipe(dk);
}

function toast(t){ S.toast=t; render(); clearTimeout(window._t);
  window._t=setTimeout(()=>{S.toast=null;render();},3200); }

/* swipe left/right cycles the two segments; ignore the screen edge and inner strips */
function attachSwipe(el){
  let x0=null,y0=null,lock=null;
  el.addEventListener("touchstart",e=>{
    const t=e.touches[0];
    if(t.clientX < 24) { x0=null; return; }            // iOS owns the left edge
    if(e.target.closest(".chipstrip")) { x0=null; return; }  // inner scroller keeps it
    x0=t.clientX; y0=t.clientY; lock=null;
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(x0===null) return;
    const t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(!lock) lock = Math.abs(dx)>Math.abs(dy)*1.4 ? "x" : "y";
  },{passive:true});
  el.addEventListener("touchend",e=>{
    if(x0===null||lock!=="x") return;
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)<60) return;
    const next = dx<0 ? "mentors" : "peers";           // two segments, stops at each end
    if(next!==S.seg){ S.seg=next; render(); }
    x0=null;
  },{passive:true});
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-seg],[data-tab],[data-open],[data-wave],[data-ev],[data-rsvp],[data-d],[data-du],[data-i],[data-st],[data-ftopic],[data-fint],[data-forg],[data-clear]");
  if(!t) return; const d=t.dataset;
  if(d.wave){ e.stopPropagation(); e.preventDefault();
    const p=DATA.people.find(x=>x.id===d.wave);
    if(S.waves[d.wave]){ delete S.waves[d.wave]; render(); return; }
    S.waves[d.wave]=true;
    toast("Request sent. NorCal SCI's coordinator makes the introduction — "+p.name.split(" ")[0]+" is not a member yet.");
    return; }
  if(d.fint){ S.filters={interest:d.fint,org:null,topic:null}; S.view=null; S.sel=null;
    S.tab="discover"; toast("Showing people into "+d.fint.toLowerCase()); return; }
  if(d.forg){ S.filters={interest:null,org:d.forg,topic:null}; S.view=null; S.sel=null;
    S.tab="discover"; toast("Showing "+d.forg); return; }
  if(d.clear){ S.filters[d.clear]=null; render(); return; }
  if(d.act==="clearf"){ S.filters={interest:null,org:null,topic:null}; render(); return; }
  if(d.ftopic){ S.filters={interest:null,org:null,topic:d.ftopic}; S.view=null; S.sel=null;
    S.tab="discover"; toast("Showing people who talk about "+d.ftopic.toLowerCase()); return; }
  if(d.act==="next"){
    ["ph","cd","nm"].forEach(id=>{ const f=$("#"+id);
      if(f) S.me[f.dataset.bind]=f.value; });
    if(S.step<7){ S.step++; render(); return; }
    S.setup=false; if(isNew()) S.seg="mentors"; render(); return; }
  if(d.act==="back"){ S.step=Math.max(0,S.step-1); render(); return; }
  if(d.act==="resetup"){ S.setup=true; S.step=3; render(); return; }
  if(d.act==="invite"){ S.me.invitedBy="NorCal SCI"; S.step=3;
    toast("Invite from NorCal SCI — phone verification skipped."); return; }
  if(d.act==="rmphoto"){ S.me.photo=null; render(); return; }
  if(d.act==="resend"){ toast("Prototype — no message sent. Any six digits work."); return; }
  if(d.act==="close"){ S.view=null; S.sel=null; render(); return; }
  if(d.act==="filters"){ toast("Filters are stubbed in this build."); return; }
  if(d.st){ S.me.state=d.st; render(); return; }
  if(d.d){ S.me.disability=d.d; render(); return; }
  if(d.du){ S.me.duration=d.du; render(); return; }
  if(d.i){ const i=S.me.interests.indexOf(d.i); i>=0?S.me.interests.splice(i,1):S.me.interests.push(d.i); render(); return; }
  if(d.seg){ S.seg=d.seg; render(); return; }
  if(d.tab){ S.tab=d.tab; S.view=null; render(); return; }
  if(d.open){ S.sel=d.open; S.view="profile"; render(); return; }
  if(d.ev){ S.sel=d.ev; S.view="event"; render(); return; }
  if(d.rsvp){ S.rsvps[d.rsvp]?delete S.rsvps[d.rsvp]:S.rsvps[d.rsvp]=true; render(); return; }
});
document.addEventListener("input",e=>{
  const k=e.target.dataset.bind; if(!k) return;
  S.me[k]=e.target.value;
  const b=document.querySelector('.btn[data-act="next"]'); if(b) b.disabled=!canNext();
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const t=e.target.closest('[data-wave][role="button"]');
  if(t){ e.preventDefault(); t.click(); }
});
render();
</script></body></html>
